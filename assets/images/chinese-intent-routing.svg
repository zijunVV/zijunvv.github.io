<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chinese intent recognition confidence routing</title>
  <desc id="desc">A confidence threshold routes known requests to a small model and uncertain requests to a larger model.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e7"/>
      <stop offset="1" stop-color="#e9e2f1"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#342940" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg2)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="86" y="98" fill="#3d3048" font-size="34" font-weight="700">Intent routing by calibrated confidence</text>
    <text x="86" y="137" fill="#6f6476" font-size="21">11,000+ dialogues · 50 known intents · 10 held-out intents</text>
  </g>
  <g filter="url(#shadow2)" font-family="Inter,Arial,sans-serif">
    <rect x="82" y="224" width="250" height="246" rx="30" fill="#fff"/>
    <text x="207" y="294" text-anchor="middle" fill="#3d3048" font-size="27" font-weight="700">Chinese request</text>
    <g fill="#efe8f4"><rect x="126" y="333" width="162" height="22" rx="11"/><rect x="126" y="373" width="116" height="22" rx="11"/><rect x="126" y="413" width="142" height="22" rx="11"/></g>
    <rect x="475" y="224" width="250" height="246" rx="30" fill="#3d3048"/>
    <text x="600" y="286" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Intent model</text>
    <text x="600" y="331" text-anchor="middle" fill="#d8cfe0" font-size="20">class + confidence</text>
    <circle cx="600" cy="398" r="40" fill="#f0b85a"/>
    <text x="600" y="407" text-anchor="middle" fill="#3d3048" font-size="24" font-weight="700">87%</text>
    <rect x="868" y="154" width="250" height="190" rx="30" fill="#fff"/>
    <text x="993" y="218" text-anchor="middle" fill="#3d3048" font-size="25" font-weight="700">High confidence</text>
    <text x="993" y="260" text-anchor="middle" fill="#6f6476" font-size="19">small-model route</text>
    <text x="993" y="309" text-anchor="middle" fill="#2b7554" font-size="30" font-weight="700">94% handled</text>
    <rect x="868" y="402" width="250" height="190" rx="30" fill="#fff"/>
    <text x="993" y="466" text-anchor="middle" fill="#3d3048" font-size="25" font-weight="700">Low confidence</text>
    <text x="993" y="508" text-anchor="middle" fill="#6f6476" font-size="19">larger-model route</text>
    <text x="993" y="557" text-anchor="middle" fill="#a34f4f" font-size="24" font-weight="700">unknown / ambiguous</text>
  </g>
  <g fill="none" stroke="#786884" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 347h116"/><path d="m432 331 16 16-16 16"/>
    <path d="M725 347h66c42 0 42-98 77-98"/><path d="m850 235 18 14-17 15"/>
    <path d="M725 347h66c42 0 42 150 77 150"/><path d="m850 483 18 14-17 15"/>
  </g>
</svg>
