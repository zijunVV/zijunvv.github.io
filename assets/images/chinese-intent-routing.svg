<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chinese intent recognition confidence routing</title>
  <desc id="desc">A confidence threshold accepts 94% of known requests at 90% accuracy and detects 42% of unseen intents. Additional fallback handling is proposed, not implemented.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4F1"/>
      <stop offset="1" stop-color="#E7EAE6"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A2620" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg2)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="86" y="98" fill="#213028" font-size="34" font-weight="700">Evaluating intent confidence thresholds</text>
    <text x="86" y="137" fill="#545B52" font-size="21">9,972 training utterances · 50 known intents · 10 held-out intents</text>
  </g>
  <g filter="url(#shadow2)" font-family="Inter,Arial,sans-serif">
    <rect x="82" y="224" width="250" height="246" rx="30" fill="#FCFDFB"/>
    <text x="207" y="294" text-anchor="middle" fill="#213028" font-size="27" font-weight="700">Chinese request</text>
    <g fill="#EFF1EE"><rect x="126" y="333" width="162" height="22" rx="11"/><rect x="126" y="373" width="116" height="22" rx="11"/><rect x="126" y="413" width="142" height="22" rx="11"/></g>
    <rect x="475" y="224" width="250" height="246" rx="30" fill="#213028"/>
    <text x="600" y="286" text-anchor="middle" fill="#FCFDFB" font-size="27" font-weight="700">Intent model</text>
    <text x="600" y="331" text-anchor="middle" fill="#D3D9D2" font-size="20">class + confidence</text>
    <circle cx="600" cy="398" r="40" fill="#C7A66A"/>
    <text x="600" y="407" text-anchor="middle" fill="#213028" font-size="24" font-weight="700">87%</text>
    <rect x="868" y="154" width="250" height="190" rx="30" fill="#FCFDFB"/>
    <text x="993" y="218" text-anchor="middle" fill="#213028" font-size="25" font-weight="700">High confidence</text>
    <text x="993" y="260" text-anchor="middle" fill="#545B52" font-size="19">90% accepted accuracy</text>
    <text x="993" y="309" text-anchor="middle" fill="#3F5A48" font-size="26" font-weight="700">94% known coverage</text>
    <rect x="868" y="402" width="250" height="190" rx="30" fill="#FCFDFB"/>
    <text x="993" y="466" text-anchor="middle" fill="#213028" font-size="25" font-weight="700">Low confidence</text>
    <text x="993" y="508" text-anchor="middle" fill="#545B52" font-size="19">fallback: next step</text>
    <text x="993" y="557" text-anchor="middle" fill="#6A2C3A" font-size="24" font-weight="700">review required</text>
  </g>
  <g fill="none" stroke="#7B8175" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 347h116"/><path d="m432 331 16 16-16 16"/>
    <path d="M725 347h66c42 0 42-98 77-98"/><path d="m850 235 18 14-17 15"/>
    <path d="M725 347h66c42 0 42 150 77 150"/><path d="m850 483 18 14-17 15"/>
  </g>
  <text x="86" y="664" fill="#545B52" font-family="Inter,Arial,sans-serif" font-size="21">Offline evaluation · 42% of unseen-intent requests detected at this threshold</text>
</svg>
