<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The AI value-capture spine: Scarcity, Control, Ownership">
  <rect width="640" height="360" fill="#F7F8F6"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#545B52">THE AI VALUE-CAPTURE SPINE</text>
  <line x1="40" y1="64" x2="600" y2="64" stroke="#DDE1DA" stroke-width="1"/>

  <!-- Scarcity -->
  <rect x="40" y="86" width="560" height="70" rx="10" fill="#F6F2E9" stroke="#E0D0AC" stroke-width="1"/>
  <circle cx="66" cy="121" r="6" fill="#9A7B35"/>
  <text x="84" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#9A7B35">Scarcity</text>
  <text x="84" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#545B52">Semiconductors &#183; Compute</text>
  <text x="584" y="127" text-anchor="end" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8C9A9B">captures value first</text>

  <!-- Control -->
  <rect x="40" y="168" width="560" height="70" rx="10" fill="#ECF1ED" stroke="#C6D4C8" stroke-width="1"/>
  <circle cx="66" cy="203" r="6" fill="#3F5A48"/>
  <text x="84" y="202" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#3F5A48">Control</text>
  <text x="84" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#545B52">Cloud &#183; Distribution</text>
  <text x="584" y="209" text-anchor="end" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8C9A9B">captures it most durably</text>

  <!-- Ownership -->
  <rect x="40" y="250" width="560" height="70" rx="10" fill="#EBEFF0" stroke="#C6D2D3" stroke-width="1"/>
  <circle cx="66" cy="285" r="6" fill="#4A5F64"/>
  <text x="84" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#4A5F64">Ownership</text>
  <text x="84" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#545B52">Agents &#183; Workflow &#183; Data</text>
  <text x="584" y="291" text-anchor="end" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8C9A9B">captures it last &#8212; but longest</text>

  <text x="40" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8C9A9B">Semiconductors &#8594; Cloud &#8594; Foundation models &#8594; Agents &#8594; Applications</text>
</svg>
