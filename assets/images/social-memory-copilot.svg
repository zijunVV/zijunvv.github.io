<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Social Memory Copilot architecture</title>
  <desc id="desc">A central agent connects session state, long-term memory, retrieval, and confirmation-gated tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#dbe8ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#72909c" stroke-width="4" stroke-dasharray="10 12" opacity=".75">
    <path d="M600 350 295 190"/><path d="M600 350 905 190"/>
    <path d="M600 350 295 530"/><path d="M600 350 905 530"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="425" y="238" width="350" height="224" rx="34" fill="#17324d"/>
    <circle cx="512" cy="331" r="42" fill="#f4b85a"/>
    <path d="M494 331h36M512 313v36" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <text x="570" y="324" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Main Agent</text>
    <text x="570" y="365" fill="#c8d8df" font-family="Inter,Arial,sans-serif" font-size="22">plan · retrieve · confirm</text>
    <rect x="485" y="396" width="230" height="34" rx="17" fill="#284d67"/>
    <text x="600" y="420" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18">Google ADK</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="120" y="100" width="350" height="170" rx="28" fill="#fff"/><text x="295" y="166" fill="#17324d" font-size="28" font-weight="700">Session State</text><text x="295" y="207" fill="#60717b" font-size="20">contact · goal · pending action</text></g>
    <g><rect x="730" y="100" width="350" height="170" rx="28" fill="#fff"/><text x="905" y="166" fill="#17324d" font-size="28" font-weight="700">Long-term Memory</text><text x="905" y="207" fill="#60717b" font-size="20">people · events · commitments</text></g>
    <g><rect x="120" y="450" width="350" height="170" rx="28" fill="#fff"/><text x="295" y="516" fill="#17324d" font-size="28" font-weight="700">Hybrid Retrieval</text><text x="295" y="557" fill="#60717b" font-size="20">BM25 · HNSW · RRF</text></g>
    <g><rect x="730" y="450" width="350" height="170" rx="28" fill="#fff"/><text x="905" y="516" fill="#17324d" font-size="28" font-weight="700">Gated Tools</text><text x="905" y="557" fill="#60717b" font-size="20">draft · remind · confirm</text></g>
  </g>
</svg>
